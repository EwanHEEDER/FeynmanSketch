name: Update DocC documentation

on:
  push:
    branches: [main]

jobs:
  build-and-deploy-docs:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -switch /Applications/Xcode.app

      - name: Generate DiagramModel documentation
        working-directory: Engine
        run: |
          mkdir -p generated-docs
          swift package --allow-writing-to-directory ./generated-docs generate-documentation \
            --target DiagramModel \
            --output-path ./generated-docs/DiagramModel \
            --transform-for-static-hosting \
            --hosting-base-path FeynmanSketch/DiagramModel

      - name: Generate DiagramConversion documentation
        working-directory: Engine
        run: |
          swift package --allow-writing-to-directory ./generated-docs generate-documentation \
            --target DiagramConversion \
            --output-path ./generated-docs/DiagramConversion \
            --transform-for-static-hosting \
            --hosting-base-path FeynmanSketch/DiagramConversion

      - name: Create index page
        working-directory: Engine
        run: |
          cat > generated-docs/index.html << 'EOF'
          <!DOCTYPE html>
          <html>
          <head>
          <meta charset="UTF-8">
          <title>FeynmanSketch — Engine Documentation</title>
          <style>
            body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; max-width: 720px; margin: 48px auto; padding: 0 24px; }
            a.card { display: block; padding: 20px 24px; background: #f5f5f7; border: 1px solid #d2d2d7; border-radius: 12px; text-decoration: none; color: #1d1d1f; margin-bottom: 16px; }
            a.card .title { font-size: 1.15rem; font-weight: 600; color: #0070E0; }
          </style>
          </head>
          <body>
            <h1>FeynmanSketch — Engine</h1>
            <a class="card" href="DiagramModel/documentation/diagrammodel/">
              <div class="title">DiagramModel</div>
            </a>
            <a class="card" href="DiagramConversion/documentation/diagramconversion/">
              <div class="title">DiagramConversion</div>
            </a>
          </body>
          </html>
          EOF

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: Engine/generated-docs
          publish_branch: gh-pages