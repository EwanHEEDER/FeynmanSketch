<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>FeynmanSketch — Engine Documentation</title>
<style>
  :root {
    color-scheme: light dark;
    --accent: #0070E0;
    --bg: #ffffff;
    --text: #1d1d1f;
    --card-bg: #f5f5f7;
    --card-border: #d2d2d7;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1e1e1e;
      --text: #f5f5f7;
      --card-bg: #2c2c2e;
      --card-border: #3a3a3c;
    }
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    margin: 0;
    padding: 0;
  }
  header {
    padding: 48px 24px 24px;
    text-align: center;
    border-bottom: 1px solid var(--card-border);
  }
  header h1 {
    font-size: 2rem;
    font-weight: 600;
    margin: 0 0 8px;
  }
  header p {
    color: var(--text);
    opacity: 0.6;
    margin: 0;
    font-size: 1rem;
  }
  main {
    max-width: 720px;
    margin: 48px auto;
    padding: 0 24px;
    display: grid;
    gap: 16px;
  }
  a.card {
    display: block;
    padding: 20px 24px;
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 12px;
    text-decoration: none;
    color: var(--text);
    transition: border-color 0.15s ease;
  }
  a.card:hover {
    border-color: var(--accent);
  }
  a.card .title {
    font-size: 1.15rem;
    font-weight: 600;
    color: var(--accent);
    margin-bottom: 4px;
  }
  a.card .subtitle {
    font-size: 0.9rem;
    opacity: 0.7;
  }
</style>
</head>
<body>
  <header>
    <h1>FeynmanSketch — Engine</h1>
    <p>Developer documentation for the portable diagram engine</p>
  </header>
  <main>
    <a class="card" href="DiagramModel/documentation/diagrammodel/">
      <div class="title">DiagramModel</div>
      <div class="subtitle">Core data structures: Point, Vertex, PropagatorLine, DiagramGraph...</div>
    </a>
    <a class="card" href="DiagramConversion/documentation/diagramconversion/">
      <div class="title">DiagramConversion</div>
      <div class="subtitle">Typst/fletcher code generation from a DiagramGraph</div>
    </a>
  </main>
</body>
</html>
